  <rect width="1200" height="300" fill="none"/>
  <g transform="translate(20 30)">
    <rect width="220" height="220" rx="34" fill="#0B2545"/>
    <path d="M38 92 L110 35 L182 92" fill="none" stroke="#BE8A2D" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="110" y="164" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="72" font-weight="700" letter-spacing="-5" fill="#FFFFFF">VP</text>
    <path d="M62 187 Q110 215 158 187" fill="none" stroke="#2E74B5" stroke-width="9" stroke-linecap="round"/>
    <path d="M76 199 Q110 219 144 199" fill="none" stroke="#BE8A2D" stroke-width="6" stroke-linecap="round"/>
